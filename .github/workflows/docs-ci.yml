name: Docs CI

on:
  pull_request:
    paths:
      - wiki/**
      - docs/releases/**
      - .github/workflows/docs-ci.yml

permissions:
  contents: read

jobs:
  build:
    name: Build VitePress
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - run: npm ci
      - run: npm run build
