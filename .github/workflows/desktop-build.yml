name: Desktop build (Windows installer)

# 打包 sidecar（PyInstaller onedir，经 bundle.resources 安装）+ Tauri NSIS 安装包，作为 artifact 上传；
# 然后在干净的 runner 上静默安装，复测体积、启动时间和退出残留（scripts/verify_installed.ps1）。
# 手动触发，或在打包相关文件变更的 PR 上触发。
# 未签名，仅供内部测试；正式发布前需要 Authenticode 签名（见 ADR-0001）。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build_sidecar.ps1
      - scripts/measure_sidecar.ps1
      - scripts/verify_installed.ps1
      - apps/desktop/src-tauri/**
      - .github/workflows/desktop-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build sidecar
        shell: pwsh
        run: ./scripts/build_sidecar.ps1
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: freeread-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Install and measure
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/verify_installed.ps1 -Installer $installer.FullName -Out verify-installed.md
          Get-Content verify-installed.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-installed
          path: verify-installed.md
          if-no-files-found: ignore
