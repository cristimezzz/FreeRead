name: Desktop build (Windows installer)

# 打包 sidecar（PyInstaller onedir，经 bundle.resources 安装）+ Tauri NSIS 安装包，作为 artifact 上传；
# 然后在干净的 runner 上静默安装，复测体积、启动时间和退出残留（scripts/verify_installed.ps1）。
# 手动触发，或在打包相关文件变更的 PR 上触发；合并到 main 时也跑一次，
# 为 PR 预热 Rust 缓存（PR 分支能读到 main 的缓存，main 读不到 PR 的，见 docs/build-speed.md）。
# 未签名，仅供内部测试；正式发布前需要 Authenticode 签名（见 ADR-0001）。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build_sidecar.ps1
      - scripts/measure_sidecar.ps1
      - scripts/verify_installed.ps1
      - apps/desktop/src-tauri/**
      - .github/workflows/desktop-build.yml
  push:
    branches: [main]
    paths:
      - scripts/build_sidecar.ps1
      - scripts/measure_sidecar.ps1
      - scripts/verify_installed.ps1
      - apps/desktop/src-tauri/**
      - .github/workflows/desktop-build.yml

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # 内部测试用的安装包：thin LTO + 并行代码生成，编译快很多，体积略大。
      # Cargo.toml 的完整设置（fat LTO、codegen-units = 1）留给正式发布构建。
      # main 和 PR 必须用同一组设置，否则依赖的指纹不同，缓存用不上。
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release
      - name: Build sidecar
        shell: pwsh
        run: ./scripts/build_sidecar.ps1
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: freeread-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Install and measure
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/verify_installed.ps1 -Installer $installer.FullName -Out verify-installed.md
          Get-Content verify-installed.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-installed
          path: verify-installed.md
          if-no-files-found: ignore
