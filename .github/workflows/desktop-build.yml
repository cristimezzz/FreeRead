name: Desktop build

# 打包 sidecar（PyInstaller onedir，经 bundle.resources 安装）+ Tauri 安装包，作为 artifact 上传：
# - Windows：NSIS 安装包和便携版 zip，在干净的 runner 上静默安装 / 解压，复测体积、启动时间和退出残留
#   （scripts/verify_installed.ps1）；
# - Linux x86_64：AppImage、deb 和 rpm（ubuntu-22.04 构建，glibc 2.35 起可用），装 deb 后冒烟 sidecar、
#   在 Xvfb 里启动壳并检查退出残留，AppImage 同样在 Xvfb 里启动一遍，rpm 在 Fedora 容器里装一遍，
#   AUR 的 PKGBUILD 在 Arch 容器里打一遍。
#   AUR 包在 Release 发布后由 aur.yml 推送。
# 手动触发，或在打包相关文件变更的 PR 上触发；合并到 main 时也跑一次，
# 为 PR 预热 Rust 缓存（PR 分支能读到 main 的缓存，main 读不到 PR 的，见 docs/build-speed.md）。
# 推送 v* tag 时用完整的 release 设置构建，复测通过后创建草稿 Release 并附上所有包（release job）。
# 未签名：正式签名需要 Authenticode 证书（见 ADR-0001）。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build_sidecar.ps1
      - scripts/measure_sidecar.ps1
      - scripts/verify_installed.ps1
      - apps/desktop/src-tauri/**
      - packaging/**
      - scripts/ci/**
      - .github/workflows/desktop-build.yml
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - scripts/build_sidecar.ps1
      - scripts/measure_sidecar.ps1
      - scripts/verify_installed.ps1
      - apps/desktop/src-tauri/**
      - packaging/**
      - scripts/ci/**
      - .github/workflows/desktop-build.yml

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # 内部测试用的安装包：thin LTO + 并行代码生成，编译快很多，体积略大。
      # tag（正式发布）用 Cargo.toml 的完整设置（fat LTO、codegen-units = 1）。
      # main 和 PR 必须用同一组设置，否则依赖的指纹不同，缓存用不上。
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME 与 tauri.conf.json 的版本 $version 不一致" }
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release
          # tag 构建的设置不同，存下来的缓存别人用不上
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build sidecar
        shell: pwsh
        run: ./scripts/build_sidecar.ps1
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      # 便携版：壳从 resource_dir()（Windows 上即 exe 所在目录）找 freeread-core/，
      # tauri-build 已把 bundle.resources 复制到 target/release/，和安装后的目录结构一致。
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $release = "apps/desktop/src-tauri/target/release"
          $stage = New-Item -ItemType Directory -Force portable-stage
          Copy-Item "$release/freeread-desktop.exe", LICENSE $stage
          Copy-Item -Recurse "$release/freeread-core" $stage
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/FreeRead_${version}_x64-portable.zip"
          Copy-Item "$release/bundle/nsis/*.exe" dist/
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: freeread-windows
          path: dist/*
          if-no-files-found: error
      - name: Install and measure
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          ./scripts/verify_installed.ps1 -Installer $installer.FullName -Out verify-installed.md
          Get-Content verify-installed.md >> $env:GITHUB_STEP_SUMMARY
      - name: Unpack portable and measure
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*-portable.zip | Select-Object -First 1
          ./scripts/verify_installed.ps1 -Portable $zip.FullName -InstallDir (Join-Path $env:RUNNER_TEMP "FreeRead-portable") -Out verify-portable.md
          Get-Content verify-portable.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-installed
          path: verify-*.md
          if-no-files-found: ignore

  build-linux:
    # 22.04 的 glibc（2.35）是安装包的最低要求：PyInstaller 打的 sidecar 和壳都链接构建机的 glibc
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
      CORE_DIR: /usr/lib/FreeRead/freeread-core
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME 与 tauri.conf.json 的版本 $version 不一致"; exit 1; }
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf xvfb gnome-keyring gdb libfuse2
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release-linux
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build sidecar
        shell: pwsh
        run: ./scripts/build_sidecar.ps1
      # tauri.conf.json 的 targets 只写了 nsis，Linux 的包类型在这里指定
      - name: Build AppImage, deb and rpm
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build -- --bundles deb,rpm,appimage
      - name: Collect packages
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: freeread-linux
          path: dist/*
          if-no-files-found: error
      - name: Install deb and smoke sidecar
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x "$CORE_DIR/freeread-core" || { echo "$CORE_DIR/freeread-core 不存在或不可执行"; exit 1; }
          bin=$(dpkg -L "$(dpkg-deb -f dist/*.deb Package)" | grep '^/usr/bin/' | head -n1)
          echo "SHELL_BIN=$bin" >> "$GITHUB_ENV"
          { echo "### Linux（deb）"; echo; echo "- 安装大小：$(du -sh /usr/lib/FreeRead | cut -f1)"; } >> "$GITHUB_STEP_SUMMARY"
          pwsh scripts/measure_sidecar.ps1 -Dir "$CORE_DIR" -Runs 3 | tee smoke.txt
          echo "- sidecar 热启动：$(tail -n1 smoke.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Launch shell under Xvfb
        run: |
          dbus-run-session -- scripts/ci/linux_launch_smoke.sh "$SHELL_BIN" "$CORE_DIR"
          echo "- Xvfb 启动壳、sidecar 随壳退出：通过" >> "$GITHUB_STEP_SUMMARY"
      # 先解包检查 sidecar 在 AppImage 里且能运行（linuxdeploy 会处理 AppDir 里的 ELF），
      # 再经 FUSE 挂载直接运行 AppImage，和用户双击一样
      - name: Run AppImage under Xvfb
        run: |
          appimage=$(realpath dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          core=$(find "$RUNNER_TEMP/squashfs-root" -path '*/freeread-core/freeread-core' -type f | head -n1)
          [ -n "$core" ] || { echo "AppImage 里没有 freeread-core"; exit 1; }
          echo "sidecar：${core#"$RUNNER_TEMP/squashfs-root"}"
          "$core" --help > /dev/null
          dbus-run-session -- scripts/ci/linux_launch_smoke.sh "$appimage" '/tmp/\.mount_[^/]*/usr/lib/[^/]*/freeread-core'
          { echo "- AppImage 大小：$(du -h "$appimage" | cut -f1)"; echo "- AppImage 在 Xvfb 里启动壳、sidecar 随壳退出：通过"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -e CORE_DIR fedora:42 bash -euc '
            dnf install -y /dist/*.rpm
            "$CORE_DIR/freeread-core" --help > /dev/null'
          echo "- rpm 在 Fedora 42 上安装、sidecar 可运行：通过" >> "$GITHUB_STEP_SUMMARY"
      - name: Build AUR package on Arch
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          mkdir aur
          packaging/aur/render.sh "$version" dist/*.deb LICENSE > aur/PKGBUILD
          # 放好与 source 同名的文件，makepkg 就不去 Release 下载
          cp dist/*.deb aur/
          cp LICENSE "aur/LICENSE-$version"
          docker run --rm -v "$PWD/aur:/aur" -e CORE_DIR archlinux:base-devel bash -euc '
            useradd -m builder
            chown -R builder /aur
            su builder -c "cd /aur && makepkg --nodeps --noconfirm"
            pacman -Syu --noconfirm
            pacman -U --noconfirm /aur/freeread-bin-*.pkg.tar.zst
            "$CORE_DIR/freeread-core" --help > /dev/null'
          echo "- AUR PKGBUILD 在 Arch 上打包、安装、sidecar 可运行：通过" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: freeread-*
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -f "$notes" || { echo "缺少更新说明 $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "FreeRead ${version}" --notes-file "$notes"
