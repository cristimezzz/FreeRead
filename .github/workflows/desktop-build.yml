name: Desktop build

# 打包 sidecar（PyInstaller onedir，经 bundle.resources 安装）+ Tauri 安装包，作为 artifact 上传：
# - Windows：NSIS 安装包和便携版 zip，在干净的 runner 上静默安装 / 解压，复测体积、启动时间和退出残留
#   （scripts/verify_installed.ps1）；
# - Linux x86_64：在 Ubuntu 22.04 容器构建 AppImage、deb 和 rpm，以 glibc 2.35 验证 sidecar；
#   在宿主机上用 Xvfb 启动 deb 和 AppImage 并检查退出残留，rpm 在 Fedora 容器里验证。
# - macOS arm64：dmg 和 .app 的 zip（ad-hoc 签名，未公证），挂载 dmg 后冒烟 sidecar、启动壳并检查退出残留；
#   Release 只附 dmg，.app 的 zip 只作为 artifact。
# Linux / macOS 用 bash 脚本（scripts/*.sh），PowerShell 脚本只在 Windows 上用。
# 手动触发，或在打包相关文件变更的 PR 上触发；合并到 main 时也跑一次，
# 为 PR 预热 Rust 缓存（PR 分支能读到 main 的缓存，main 读不到 PR 的，见 docs/build-speed.md）。
# 推送 v* tag 时用完整的 release 设置构建，复测通过后创建草稿 Release 并附上所有包（release job）。
# 未签名：正式签名需要 Authenticode 证书（见 ADR-0001）。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build_sidecar.ps1
      - scripts/build_sidecar.sh
      - scripts/measure_sidecar.ps1
      - scripts/measure_sidecar.sh
      - scripts/verify_installed.ps1
      - apps/desktop/**
      - '!apps/desktop/**/*.md'
      - core/freeread/**
      - core/prompts/**
      - core/pyproject.toml
      - scripts/engines/**
      - scripts/ci/**
      - .github/workflows/desktop-build.yml
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - scripts/build_sidecar.ps1
      - scripts/build_sidecar.sh
      - scripts/measure_sidecar.ps1
      - scripts/measure_sidecar.sh
      - scripts/verify_installed.ps1
      - apps/desktop/**
      - '!apps/desktop/**/*.md'
      - core/freeread/**
      - core/prompts/**
      - core/pyproject.toml
      - scripts/engines/**
      - scripts/ci/**
      - .github/workflows/desktop-build.yml

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # 内部测试用的安装包：thin LTO + 并行代码生成，编译快很多，体积略大。
      # tag（正式发布）用 Cargo.toml 的完整设置（fat LTO、codegen-units = 1）。
      # main 和 PR 必须用同一组设置，否则依赖的指纹不同，缓存用不上。
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME 与 tauri.conf.json 的版本 $version 不一致" }
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release
          # tag 构建的设置不同，存下来的缓存别人用不上
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build sidecar
        shell: pwsh
        run: ./scripts/build_sidecar.ps1
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      # 便携版：壳从 resource_dir()（Windows 上即 exe 所在目录）找 freeread-core/，
      # tauri-build 已把 bundle.resources 复制到 target/release/，和安装后的目录结构一致。
      - name: Package portable zip
        id: packages
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $release = "apps/desktop/src-tauri/target/release"
          $stage = New-Item -ItemType Directory -Force portable-stage
          Copy-Item "$release/freeread-desktop.exe", LICENSE $stage
          Copy-Item -Recurse "$release/freeread-core" $stage
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/FreeRead_${version}_x64-portable.zip"
          Copy-Item "$release/bundle/nsis/*.exe" dist/
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: freeread-windows
          path: dist/*
          if-no-files-found: error
      - name: Install and measure
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          ./scripts/verify_installed.ps1 -Installer $installer.FullName -Out verify-installed.md
          Get-Content verify-installed.md >> $env:GITHUB_STEP_SUMMARY
      - name: Unpack portable and measure
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*-portable.zip | Select-Object -First 1
          ./scripts/verify_installed.ps1 -Portable $zip.FullName -InstallDir (Join-Path $env:RUNNER_TEMP "FreeRead-portable") -Out verify-portable.md
          Get-Content verify-portable.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-installed
          path: verify-*.md
          if-no-files-found: ignore

  build-linux:
    # 壳和 sidecar 都链接构建环境的 glibc，保留 22.04 的 2.35 基线。
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    # 显式写 bash：GitHub 才会加 -o pipefail，`measure_sidecar.sh | tee` 失败时步骤跟着失败
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
      CORE_DIR: /usr/lib/FreeRead/freeread-core
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl file git jq patchelf perl pkg-config procps unzip wget xz-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev
      - uses: actions/checkout@v7
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME 与 tauri.conf.json 的版本 $version 不一致"; exit 1; }
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release-linux
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build sidecar
        run: scripts/build_sidecar.sh
      # tauri.conf.json 的 targets 只写了 nsis，Linux 的包类型在这里指定
      - name: Build AppImage, deb and rpm
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm ci
          npm run tauri build -- --bundles deb,rpm,appimage
      - name: Collect packages
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: freeread-linux
          path: dist/*
          if-no-files-found: error
      - name: Install deb and smoke sidecar
        run: |
          apt-get install -y ./dist/*.deb
          test -x "$CORE_DIR/freeread-core" || { echo "$CORE_DIR/freeread-core 不存在或不可执行"; exit 1; }
          { echo "### Linux（deb）"; echo; echo "- 安装大小：$(du -sh /usr/lib/FreeRead | cut -f1)"; } >> "$GITHUB_STEP_SUMMARY"
          scripts/measure_sidecar.sh --dir "$CORE_DIR" --runs 3 | tee smoke.txt
          echo "- sidecar 热启动：$(tail -n1 smoke.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Extract AppImage and smoke sidecar
        run: |
          appimage=$(realpath dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          core=$(find "$RUNNER_TEMP/squashfs-root" -path '*/freeread-core/freeread-core' -type f -print -quit)
          [ -n "$core" ] || { echo "AppImage 里没有 freeread-core"; exit 1; }
          echo "sidecar：${core#"$RUNNER_TEMP/squashfs-root"}"
          scripts/measure_sidecar.sh --dir "$(dirname "$core")" --runs 1

  smoke-linux:
    needs: build-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CORE_DIR: /usr/lib/FreeRead/freeread-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: freeread-linux
          path: dist
      - name: Install deb and desktop smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb dbus-daemon xvfb xauth gnome-keyring gdb libfuse2t64
      - name: Launch shell under Xvfb
        run: |
          bin=$(dpkg -L "$(dpkg-deb -f dist/*.deb Package)" | awk '/^\/usr\/bin\/[^/]+$/ && !found { print; found = 1 }')
          test -x "$bin"
          dbus-run-session -- scripts/ci/linux_launch_smoke.sh "$bin" "$CORE_DIR"
          echo "- Xvfb 启动壳、sidecar 随壳退出：通过" >> "$GITHUB_STEP_SUMMARY"
      - name: Run AppImage under Xvfb
        run: |
          appimage=$(realpath dist/*.AppImage)
          chmod +x "$appimage"
          dbus-run-session -- scripts/ci/linux_launch_smoke.sh "$appimage" '/tmp/\.mount_[^/]*/usr/lib/[^/]*/freeread-core'
          { echo "- AppImage 大小：$(du -h "$appimage" | cut -f1)"; echo "- AppImage 在 Xvfb 里启动壳、sidecar 随壳退出：通过"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install rpm on Fedora
        run: |
          # 只对本次构建的本地 RPM 关闭签名检查，Fedora 软件源的检查照常执行。
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/scripts/measure_sidecar.sh:/measure_sidecar.sh:ro" \
            -e CORE_DIR fedora:45 bash -euc '
              dnf install -y --setopt=localpkg_gpgcheck=0 /dist/*.rpm /usr/bin/curl jq perl-IO perl-Time-HiRes procps-ng
              bash /measure_sidecar.sh --dir "$CORE_DIR" --runs 1'
          echo "- rpm 在 Fedora 45 上安装、sidecar 冒烟：通过" >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    # Apple Silicon；PyInstaller 打的 sidecar 不能交叉编译，Intel 版要另开 x86_64 runner
    runs-on: macos-latest
    # 显式写 bash：GitHub 才会加 -o pipefail，`measure_sidecar.sh | tee` 失败时步骤跟着失败
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME 与 tauri.conf.json 的版本 $version 不一致"; exit 1; }
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release-macos
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build sidecar
        run: scripts/build_sidecar.sh
      # tauri.conf.json 的 targets 只写了 nsis，macOS 的包类型在这里指定
      - name: Build app and dmg
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build -- --bundles app,dmg
      - name: Collect packages
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir -p dist
          cp "$bundle"/dmg/*.dmg dist/
          ditto -c -k --keepParent "$bundle/macos/FreeRead.app" "dist/FreeRead_${version}_aarch64.app.zip"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: freeread-macos
          path: dist/*
          if-no-files-found: error
      - name: Mount dmg and smoke sidecar
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/*.dmg
          cp -R "$mnt/FreeRead.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/FreeRead.app"
          echo "APP=$app" >> "$GITHUB_ENV"
          codesign --verify --deep --strict "$app"
          {
            echo "### macOS（dmg）"; echo
            echo "- dmg 大小：$(du -h dist/*.dmg | cut -f1)"
            echo "- 安装大小：$(du -sh "$app" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/measure_sidecar.sh --dir "$app/Contents/Resources/freeread-core" --runs 3 | tee smoke.txt
          echo "- sidecar 热启动：$(tail -n1 smoke.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Launch shell
        run: |
          scripts/ci/macos_launch_smoke.sh "$APP"
          echo "- 启动壳、sidecar 随壳退出：通过" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, smoke-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: freeread-*
          merge-multiple: true
          path: dist
      # macOS 只发 dmg；.app 的 zip 留在 artifact 里供测试
      - name: Drop macOS app zip
        run: rm -f dist/*.app.zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -f "$notes" || { echo "缺少更新说明 $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "FreeRead ${version}" --notes-file "$notes"
