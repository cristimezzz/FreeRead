name: M0 verify and native packages
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: m0-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          helper="$(dirname "$(node -p 'require("electron")')")/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: pnpm verify
      - run: pnpm build
      - run: pnpm size
      - run: pnpm test:e2e
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum pnpm test:e2e
        if: runner.os == 'Linux'
      - run: pnpm license:source-offer
      - run: pnpm build:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          BUILD_ID: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: m0-${{ matrix.os }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.json
            artifacts/source.tar.gz
          if-no-files-found: error
      - name: Configure unpacked Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root artifacts/linux-unpacked/chrome-sandbox
          sudo chmod 4755 artifacts/linux-unpacked/chrome-sandbox
      - name: Packaged M1 E2E
        if: runner.os != 'Linux'
        run: pnpm exec playwright test
        env:
          FR_PACKAGED: '1'
      - name: Packaged M1 E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm exec playwright test
        env:
          FR_PACKAGED: '1'
      - run: pnpm test:cold-start --packaged
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum pnpm test:cold-start --packaged
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
