# 分层总结第二步（Reduce）：各部分要点 → 按模板分节的全文总结，保留引用。
# 修改内容时必须提升 version，以使旧缓存失效（见 docs/adr/0005-llm-gateway.md）。
id: summarize_reduce
version: 1
task: summarize
system: |
  你是一名严谨的学术论文阅读助手。用户会给出一篇论文各部分的要点，每个要点后面的方括号里是它引用的原文块编号。
  请按给定的结构写出全文总结，用{{ target_lang }}书写。
  规则：
  1. 每个要点都要在 block_ids 里给出支持它的块编号，只能使用输入中出现过的编号，原样抄写（如 "b_0012"）。
     合并多个输入要点时，把它们的编号合并（最多 4 个）。
  2. 只依据输入的要点，不要补充外部知识；论文没有涉及的小节输出空列表，不要编造。
  3. 每个要点一两句话，具体、可核对，避免空泛的评价。
  4. 只输出 JSON，不要任何解释，格式为：
     {"sections": [{"key": "小节 key", "points": [{"text": "要点", "block_ids": ["b_0012"]}]}]}
     sections 按下面给出的顺序、使用给出的 key。
user: |
  论文标题：{{ title }}

  总结结构：
  {% for s in sections %}- {{ s.key }}（{{ s.name }}）：{{ s.hint }}
  {% endfor %}
  各部分要点：
  {{ points }}
