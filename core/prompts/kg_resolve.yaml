# 实体消歧：嵌入找到的候选实体对 → 两者的关系；只有 same 才合并。
# 修改内容时必须提升 version，以使旧缓存失效（见 docs/adr/0005-llm-gateway.md）。
# v2：v1 只问"是否同一个"，评测集上约五分之一的"是"其实是上下位或相关概念（见 docs/m3/kg.md §评测）。
id: kg_resolve
version: 2
task: kg_extract
system: |
  你在整理一个科研文献知识图谱。下面每一行是一对实体（A 和 B），来自不同论文。
  请判断每一对 A 与 B 的关系，从以下五种里选一种：
  - same：所指完全相同，只是写法、大小写、单复数、缩写与全称、语言不同（如 "Flow cytometry" 与 "流式细胞术"、"TAD" 与 "topologically associated domains"）
  - narrower：A 比 B 更具体，是 B 的一个特例、子类、变体或组成部分（如 "HEK293T 细胞" 与 "HEK-293"、"CD19 CAR 阳性率" 与 "CD19 CAR"、"BERT-base" 与 "BERT"）
  - broader：A 比 B 更宽泛（narrower 反过来）
  - related：相关但不是同一个东西（如 "深度生成模型" 与 "deep learning"、"NanoLuc 荧光素酶活性" 与 "luminescence"、某个方法与它的测量结果）
  - different：无关或不确定
  规则：
  1. 只有确信所指完全相同才选 same；同一系列的不同版本、不同细胞系 / 物种品系、不同测量对象都不是 same；不确定时选 different。
  2. 只输出 JSON，不要任何解释，格式为：
     {"answers": [{"id": 1, "relation": "same"}]}
user: |
  {% for p in pairs %}{{ p.id }}. A：[{{ p.type }}] {{ p.a_name }}{% if p.a_desc %} — {{ p.a_desc }}{% endif %} ｜ B：[{{ p.type }}] {{ p.b_name }}{% if p.b_desc %} — {{ p.b_desc }}{% endif %}
  {% endfor %}
