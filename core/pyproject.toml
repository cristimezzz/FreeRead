[project]
name = "freeread-core"
version = "0.2.0"
description = "FreeRead core service: library import, PDF parsing to Document IR, LLM translation, summary and graph QA."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # 快速解析模式随 sidecar 分发（FreeRead 为 AGPL，见 ADR-0003）。
    # <2：PyMuPDF 2.0 依赖 pymupdf-layout，import 时就加载 ONNX 版面模型及其资源文件，
    # PyInstaller 打包后找不到资源，导入 PDF 直接报错；升级前需要单独评估打包与解析结果。
    "pymupdf>=1.24,<2",
    # 检索：向量索引（sqlite-vec，ADR-0002）与内置嵌入模型（ONNX，首次使用时下载）
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 解析引擎按需安装，见 docs/adr/0003-pluggable-parser.md
graph = ["networkx>=3.2"]
# M0 解析评测脚本（scripts/m0_*.py）
eval = ["pymupdf>=1.24,<2", "psutil>=5.9", "nvidia-ml-py>=12.0", "rapidfuzz>=3.0", "pyyaml>=6.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff>=0.4"]

[project.scripts]
freeread-core = "freeread.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freeread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 单个测试卡住时尽快失败，并打印所有线程的调用栈（CI 上曾整整卡死 14 分钟）
timeout = 60
timeout_method = "thread"
markers = ["slow: 需要下载真实模型等外部资源，默认跳过（pytest -m slow 运行）"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"
