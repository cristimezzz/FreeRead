[project]
name = "freeread-core"
version = "0.0.1"
description = "FreeRead core service: library import, PDF parsing to Document IR, LLM translation, summary and graph QA."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 解析引擎按需安装，见 docs/adr/0003-pluggable-parser.md
parse-fast = ["pymupdf>=1.24"]
vector = ["sqlite-vec>=0.1"]
graph = ["networkx>=3.2"]
# M0 解析评测脚本（scripts/m0_*.py）
eval = ["pymupdf>=1.24", "psutil>=5.9", "nvidia-ml-py>=12.0", "rapidfuzz>=3.0", "pyyaml>=6.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
freeread-core = "freeread.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freeread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
