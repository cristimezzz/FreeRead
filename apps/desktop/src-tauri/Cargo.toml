[package]
name = "freeread-desktop"
version = "0.2.1"
description = "FreeRead desktop shell"
authors = ["FreeRead"]
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "freeread_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# 系统钥匙串（Windows 凭据管理器 / macOS Keychain / Secret Service），存 LLM API Key
keyring = "4.2"
# 设置页「关于」：查询 GitHub Release 与贡献者、下载更新（src/update.rs）。走系统 TLS（Windows 上是 schannel），不另编 TLS 库
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy", "http2"] }
sha2 = "0.10"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# 开发构建：只给本 crate 留行号（panic 回溯够用），依赖不生成调试信息。
# 调试信息是 Windows 上编译和链接的大头（PDB 很大）；要在调试器里单步依赖时临时改回 debug = true。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# M0 实测：本机 Kaspersky 会锁住 / 拒绝执行 release 下新编出的 cookie 构建脚本
# （os error 32 / 5，见 docs/m0-tauri-sidecar.md）。换个优化级别让构建脚本二进制不同即可绕过；
# 不能用 debug = true，否则 cc-rs 加 -Z7 后 VS 2026 的 cl.exe 报 D8050。
[profile.release.build-override]
opt-level = 1
