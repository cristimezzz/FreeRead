[package]
name = "freeread-desktop"
version = "0.0.1"
description = "FreeRead desktop shell"
authors = ["FreeRead"]
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "freeread_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# 系统钥匙串（Windows 凭据管理器 / macOS Keychain / Secret Service），存 LLM API Key
keyring = "4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# M0 实测：本机 Kaspersky 会锁住 / 拒绝执行 release 下新编出的 cookie 构建脚本
# （os error 32 / 5，见 docs/m0-tauri-sidecar.md）。换个优化级别让构建脚本二进制不同即可绕过；
# 不能用 debug = true，否则 cc-rs 加 -Z7 后 VS 2026 的 cl.exe 报 D8050。
[profile.release.build-override]
opt-level = 1
